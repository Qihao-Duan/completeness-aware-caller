# Keeps the published images in step with the repository.
#
# Pushes to main rebuild :edge. A v* tag builds the release tags. Pull
# requests build without pushing, so a broken Dockerfile fails the PR rather
# than the registry.
#
# The caller image is multi-arch. The benchmark image is amd64 only: bioconda
# does not ship linux-aarch64 builds of BUSCO's dependency chain, and emulated
# arm64 builds of a 2 GB conda environment time out.
name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  caller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=edge,branch=main
            type=sha,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          target: caller
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  benchmark:
    runs-on: ubuntu-latest
    # Only on an explicit release tag: a 2 GB conda image is not worth
    # rebuilding on every commit to main.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=-benchmark,onlatest=true
          tags: |
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          target: benchmark
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/ -q
      - name: Demo must abstain
        run: |
          python3 completeness_aware_caller.py --demo --output /tmp/ci_demo
          grep -q "CANNOT CONCLUDE" /tmp/ci_demo/report.md
