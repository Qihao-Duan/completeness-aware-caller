# The caller Job: gate a set of gene-search results against a completeness
# estimate. Seconds to run, no network, no bioinformatics tooling.
#
#   kubectl -n clawbio create job caller-$(date +%s) --from=cronjob/... # no
#   kubectl apply -f k8s/job-caller.yaml
#   kubectl -n clawbio logs job/caller
#
# To gate a real run instead of the bundled example, point --busco-json at a
# result.json on the shared volume (see the commented args below).
apiVersion: batch/v1
kind: Job
metadata:
  name: caller
  namespace: clawbio
  labels:
    app.kubernetes.io/name: completeness-aware-caller
    app.kubernetes.io/component: caller
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: completeness-aware-caller
        app.kubernetes.io/component: caller
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caller
          image: ghcr.io/qihao-duan/completeness-aware-caller:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --completeness
            - "0.681"
            - --genes
            - /input/genes.json
            - --ani-a
            - "81.445"
            - --ani-b
            - "80.749"
            - --output
            - /data/calls/manual
            # Reading a real BUSCO run off the shared volume instead:
            # - --busco-json
            # - /data/busco/frag70/result.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: genes
              mountPath: /input
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: caller-data
        - name: genes
          configMap:
            name: caller-genes
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
