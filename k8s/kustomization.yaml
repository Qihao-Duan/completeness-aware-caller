apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: clawbio

commonLabels:
  app.kubernetes.io/name: completeness-aware-caller
  app.kubernetes.io/version: 0.1.0
  app.kubernetes.io/part-of: clawbio

resources:
  - base.yaml
  - job-caller.yaml
  # The benchmark Job is heavy and long-running, so it is opt-in. Uncomment,
  # or apply it directly:  kubectl apply -f k8s/job-benchmark.yaml
  # - job-benchmark.yaml

images:
  - name: ghcr.io/qihao-duan/completeness-aware-caller
    newTag: 0.1.0
